<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AVAL Store — Full Design Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--pr:#7A1026;--dk:#3A1520;--bg:#FBF7F3;--bl:#EBD3CF;--bd:#E8CFCB;--cd:#fff;--ok:#2e6b3f;--wn:#a15c00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--dk);font:15px Jost,system-ui,sans-serif}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;margin:0}h1{font-size:36px}h2{font-size:24px}
.app{display:flex;min-height:100vh}aside{width:210px;background:#3A1520;color:#FBF7F3;padding:20px 14px;display:flex;flex-direction:column;gap:4px;flex:none}
aside .lg{display:flex;align-items:center;gap:8px;margin-bottom:14px}aside img{width:44px;border-radius:4px}aside .lg span{font:32px 'Pinyon Script',cursive}
aside a{color:#FBF7F3;text-decoration:none;padding:9px 10px;border-radius:3px;min-height:40px;display:flex;align-items:center}aside a.on,aside a:hover{background:#7A1026}
aside hr{border:0;border-top:1px solid #7a3a48;width:100%}
main{flex:1;min-width:0;padding:28px 36px;display:flex;flex-direction:column;gap:18px}
.cd{background:var(--cd);border:1px solid var(--bd);padding:18px;overflow-x:auto}.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.bt,.bo{padding:10px 18px;min-height:40px;font:15px Jost,sans-serif;cursor:pointer;border:1px solid var(--pr)}.bt{background:#7A1026;color:#FBF7F3}.bo{background:transparent;color:var(--pr)}.sm{padding:4px 10px;min-height:30px;font-size:13px}
.in{padding:10px;font:15px Jost,sans-serif;border:1px solid var(--pr);background:var(--cd);color:var(--dk);width:100%}label{display:flex;flex-direction:column;gap:5px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}th{text-align:left;padding:9px;border-bottom:1px solid var(--bd)}td{padding:9px;border-bottom:1px solid var(--bd)}
.tg{display:inline-block;padding:2px 8px;font-size:12px;background:var(--bl);color:var(--dk)}.tg.ok{background:#dcefe1;color:#1d4a2b}.tg.wn{background:#fbe8c8;color:#7a4700}.tg.bad{background:#f6d3d8;color:#7A1026}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}.r{display:flex;justify-content:space-between;padding:4px 0}
.k{font:600 30px 'Cormorant Garamond',serif}.mut{opacity:.7;font-size:13px}.bar{height:14px;background:var(--pr);display:inline-block;vertical-align:middle}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:16px;background:#3A1520;color:#FBF7F3;padding:10px 16px;display:none;z-index:9}
:focus-visible{outline:2px solid #c0556b;outline-offset:2px}
@media(max-width:800px){.app,.appw{flex-direction:column}aside{width:100%;flex-direction:row;flex-wrap:wrap;padding:10px}aside .lg,aside hr{display:none}main{padding:18px}}
@media print{aside,.bar,.np{display:none}}
.mk{font-family:Jost,sans-serif;color:#3A1520}.mk a{color:#7A1026}.mk a:hover{color:#3A1520}.mk .p{max-width:1280px;margin:0 auto;background:#FBF7F3;font-family:Jost,sans-serif;color:#3A1520}.mk .h{font-family:'Cormorant Garamond',serif;font-weight:600;margin:0;color:#3A1520}.mk .bt{display:inline-block;box-sizing:border-box;background:#7A1026;color:#FBF7F3;padding:12px 24px;border:0;font:15px Jost,sans-serif;min-height:44px;text-decoration:none;cursor:pointer}.mk .bo{display:inline-block;box-sizing:border-box;background:transparent;color:#7A1026;padding:12px 24px;border:1px solid #7A1026;font:15px Jost,sans-serif;min-height:44px;text-decoration:none}.mk .in{padding:12px;font:15px Jost,sans-serif;border:1px solid #7A1026;background:#fff;width:100%;box-sizing:border-box;color:#3A1520}.mk .lb{display:flex;flex-direction:column;gap:6px;font-size:14px}.mk .ph{background:#EBD3CF;display:flex;align-items:center;justify-content:center;font-size:13px;color:#7A1026;text-align:center}.mk .cd{background:#fff;border:1px solid #E8CFCB;padding:20px;box-sizing:border-box}.mk .tg{background:#7A1026;color:#FBF7F3;padding:2px 8px;font-size:12px}.mk .r{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:4px 0}.mk .g{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.mk .w{display:flex;flex-wrap:wrap;gap:24px}.mk .t{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}.mk .t th{text-align:left;padding:10px;border-bottom:1px solid #E8CFCB}.mk .t td{padding:10px;border-bottom:1px solid #F1E2DF}.mk .p{max-width:none}.mk img{max-width:100%}.bar{position:sticky;top:0;z-index:20;background:#3A1520;color:#FBF7F3;padding:8px 12px;display:flex;gap:6px;overflow-x:auto;align-items:center;white-space:nowrap}.bar b{font:12px Jost;opacity:.6;margin:0 4px 0 10px}.bar button{background:transparent;border:1px solid #7a3a48;color:#FBF7F3;padding:5px 10px;font:13px Jost,sans-serif;cursor:pointer;min-height:32px}.bar button.on{background:#7A1026}.appw{display:flex;min-height:calc(100vh - 50px)}
</style></head><body><div class="bar" id="bar"></div><div id="view"></div><div id="toast" role="status"></div>

categories(){return `<div class="row"><h1>Categories</h1><button class="bt" onclick="addCat()">Add category</button></div><div class="cd"><table><tr><th>Name</th><th>Parent</th><th>Products</th><th>Status</th><th></th></tr>${S.cats.map((c,i)=>`<tr><td>${esc(c.n)}<div class="mut">/category/${c.s}</div></td><td>${c.p||'—'}</td><td>${c.c}</td><td>${tag(c.v?'Visible':'Hidden',c.v?'ok':'wn')}</td><td><button class="bo sm" aria-label="Move up" onclick="mvCat(${i},-1)">↑</button> <button class="bo sm" aria-label="Move down" onclick="mvCat(${i},1)">↓</button> <button class="bo sm" onclick="S.cats[${i}].v^=1;go()">${c.v?'Hide':'Show'}</button> <button class="bo sm" onclick="S.cats.splice(${i},1);go();T('Archived')">Archive</button></td></tr>`).join('')}</table></div><div class="cd" id="cf" hidden><h2>New category</h2><div class="g"><label>Name<input class="in" id="cn"></label><label>Parent<select class="in" id="cp"><option value="">None</option>${S.cats.map(c=>`<option>${esc(c.n)}</option>`)}</select></label><label>Banner image<input class="in" type="file" accept="image/*"></label></div><p><button class="bt" onclick="saveCat()">Save</button></p></div>`},
inventory(){const low=S.inv.filter(x=>x.q<=x.t).length;return `<h1>Inventory</h1><div class="g"><div class="cd">Low / out of stock<div class="k">${low}</div></div><div class="cd">SKUs<div class="k">${S.inv.length}</div></div></div><div class="cd"><table><tr><th>SKU</th><th>Product</th><th>Stock</th><th>Threshold</th><th>Status</th><th>Adjust</th></tr>${S.inv.map((x,i)=>`<tr><td>${x.sku}</td><td>${esc(x.n)}</td><td>${x.q}</td><td>${x.t}</td><td>${x.q==0?tag('Out of stock','bad'):x.q<=x.t?tag('Low','wn'):tag('In stock','ok')}</td><td><button class="bo sm" onclick="adj(${i})">± Adjust</button></td></tr>`).join('')}</table></div><div class="cd"><h2>Movement history</h2>${S.mv.length?`<table><tr><th>When</th><th>SKU</th><th>Change</th><th>Reason</th></tr>${S.mv.map(m=>`<tr><td>${m[0]}</td><td>${m[1]}</td><td>${m[2]}</td><td>${esc(m[3])}</td></tr>`).join('')}</table>`:'<p class="mut">No adjustments yet. Every change needs a reason and is logged.</p>'}</div>`},
customers(){const q=(window.cq||'').toLowerCase();return `<h1>Customers</h1><input class="in" style="max-width:300px" placeholder="Search name or email" aria-label="Search customers" value="${esc(window.cq||'')}" oninput="cq=this.value;go(1)"><div class="cd"><table><tr><th>Customer</th><th>Orders</th><th>Total spent</th><th>Status</th><th>Support note</th><th></th></tr>${S.cu.map((c,i)=>(c.n+c.e).toLowerCase().includes(q)?`<tr><td>${esc(c.n)}<div class="mut">${c.e}</div></td><td>${c.o}</td><td>${R(c.sp)}</td><td>${tag(c.st,c.st=='Active'?'ok':'bad')}</td><td><input class="in" aria-label="Note" value="${esc(c.note)}" onchange="S.cu[${i}].note=this.value;T('Note saved')"></td><td><button class="bo sm" onclick="S.cu[${i}].st=S.cu[${i}].st=='Active'?'Suspended':'Active';go()">${c.st=='Active'?'Suspend':'Reactivate'}</button></td></tr>`:'').join('')}</table></div>`},
content(){const c=S.ct;return `<h1>Content</h1><div class="cd"><h2>Announcement bar</h2><label>Text<input class="in" value="${esc(c.announce)}" onchange="S.ct.announce=this.value"></label></div><div class="cd"><h2>Homepage banners</h2>${c.banners.map((b,i)=>`<div class="row" style="margin:6px 0"><input class="in" style="flex:1" value="${esc(b)}" onchange="S.ct.banners[${i}]=this.value"><button class="bo sm" onclick="S.ct.banners.splice(${i},1);go()">Remove</button></div>`).join('')}<button class="bo sm" onclick="S.ct.banners.push('New banner');go()">Add banner</button></div><div class="cd"><h2>Brand story</h2><label>Text<textarea class="in" rows="3" onchange="S.ct.story=this.value">${esc(c.story)}</textarea></label></div><div class="cd"><h2>FAQs</h2>${c.faq.map((f,i)=>`<div class="g" style="margin:6px 0"><input class="in" value="${esc(f[0])}" onchange="S.ct.faq[${i}][0]=this.value"><input class="in" value="${esc(f[1])}" onchange="S.ct.faq[${i}][1]=this.value"></div>`).join('')}<button class="bo sm" onclick="S.ct.faq.push(['Question','Answer']);go()">Add FAQ</button></div><button class="bt" style="align-self:flex-start" onclick="T('Content saved')">Save changes</button>`},
reviews(){return `<h1>Reviews</h1><div class="cd"><table><tr><th>Product</th><th>Review</th><th>Flags</th><th>Reply</th><th></th></tr>${S.rv.map((r,i)=>`<tr><td>${esc(r.p)}</td><td>${'★'.repeat(r.r)}<br>${esc(r.t)}<div class="mut">${esc(r.u)}</div></td><td>${r.vp?tag('Verified purchase','ok'):tag('Unverified','wn')} ${r.vis?tag('Visible'):tag('Hidden','bad')}</td><td><input class="in" aria-label="Reply" value="${esc(r.rep)}" placeholder="Public reply" onchange="S.rv[${i}].rep=this.value;T('Reply saved')"></td><td><button class="bo sm" onclick="S.rv[${i}].vis^=1;go()">${r.vis?'Hide':'Show'}</button></td></tr>`).join('')}</table></div>`},
reports(){const d=[['Gross sales',184500],['Discounts',-21300],['Refunds',-4200],['Shipping collected',6800],['Tax (GST, per settings)',0]],net=d[0][1]+d[1][1]+d[2][1],mx=[60,45,80,70,95,88,100];return `<div class="row"><h1>Reports</h1><div><select class="in" style="width:auto" onchange="T('Range: '+this.value)" aria-label="Date range"><option>Last 30 days</option><option>Last 7 days</option><option>This year</option></select> <button class="bo" onclick="csv()">Export CSV</button></div></div><div class="cd">${d.map(x=>`<div class="r"><span>${x[0]}</span><b>${R(x[1])}</b></div>`).join('')}<div class="r" style="border-top:1px solid var(--bd);margin-top:6px"><b>Net revenue (excl. shipping &amp; tax)</b><b>${R(net)}</b></div><p class="mut">Sample figures. Real values come from the orders database.</p></div><div class="cd"><h2>Weekly sales trend</h2>${mx.map((v,i)=>`<div class="r"><span>W${i+1}</span><span style="flex:1;margin:0 10px"><span class="bar" style="width:${v}%"></span></span><span>${R(v*1800)}</span></div>`).join('')}</div>`},
